<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador de Precios Logi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="app-css">
/* Layout: barra de búsqueda fija arriba, lista de resultados que se expande en ficha al tocar; panel de carga plegable */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#141a24; --muted:#5d6878; --line:#dde2ea;
  --accent:#1d4ed8; --accent-soft:#e3eafc;
  --ok:#137a4b; --ok-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b42318; --bad-soft:#fde4e1;
  --gold:#8a5a00; --gold-soft:#fff1cc;
  --f-display:"Archivo",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171d27; --fg:#e8ecf3; --muted:#97a2b4; --line:#283142;
  --accent:#7aa2ff; --accent-soft:#1d2a47;
  --ok:#5fd29a; --ok-soft:#14301f; --warn:#f0b75a; --warn-soft:#33270f; --bad:#ff8a7e; --bad-soft:#3a1814;
  --gold:#ffd27a; --gold-soft:#3a2c0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171d27; --fg:#e8ecf3; --muted:#97a2b4; --line:#283142;
  --accent:#7aa2ff; --accent-soft:#1d2a47;
  --ok:#5fd29a; --ok-soft:#14301f; --warn:#f0b75a; --warn-soft:#33270f; --bad:#ff8a7e; --bad-soft:#3a1814;
  --gold:#ffd27a; --gold-soft:#3a2c0c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);font-size:15px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 10px;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
h1 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--f-display);padding:8px 12px;border-radius:10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative}
.search input{width:100%;font:500 17px var(--f-display);color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 44px 13px 42px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:20px;width:32px;height:32px;border-radius:8px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--f-display);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.upd{margin:0;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}.upd strong{color:var(--fg);font-weight:600}
.count{color:var(--muted);font-size:13px;margin:0}
.upload{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;margin-top:4px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:20px 14px;text-align:center;color:var(--muted);cursor:pointer;display:grid;gap:6px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop strong{color:var(--fg)}
.status{font-size:13px;display:grid;gap:4px}
.status .msg{padding:8px 10px;border-radius:8px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.err{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:8px;margin-top:6px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.name{font-weight:600;min-width:0}
.meta{grid-column:1;display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.sku{font-family:var(--f-mono);font-size:12px}
.price{grid-row:1/3;grid-column:2;text-align:right;font-variant-numeric:tabular-nums}
.price b{display:block;font-size:17px;font-weight:700}
.price s{font-size:12px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-inc{background:var(--gold-soft);color:var(--gold)}
mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px}
.detail{border-top:1px solid var(--line);padding:14px;display:grid;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kv{display:grid;gap:2px}
.kv span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kv strong{font-variant-numeric:tabular-nums;font-size:16px}
.kv.hl strong{color:var(--accent);font-size:20px}
.kv.inc strong{color:var(--gold)}
h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tw{overflow-x:auto}
.up{color:var(--bad)}.down{color:var(--ok)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 13px var(--f-display);padding:6px 10px;border-radius:8px;cursor:pointer;text-align:left}
.rel button:hover{border-color:var(--accent)}
.rel button em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px}
.combo{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.combo:last-child{border-bottom:0}
.combo .n{font-weight:600;font-size:14px;min-width:0}
.combo .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.combo .s{font-size:12px;color:var(--muted)}
.copy{border:0;background:none;color:var(--accent);font:600 12px var(--f-display);cursor:pointer;padding:0}
.empty{padding:32px 8px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.feat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.feat ul{margin:0;padding-left:18px;display:grid;gap:4px}
.feat li{line-height:1.4}
.feat .dif{margin:0;font-size:13.5px}
.feat .dif b{font-weight:600}
.src{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.src a{color:var(--accent);text-decoration:none}
.src a:hover{text-decoration:underline}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.facts div{display:grid;gap:1px}.facts span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ideal{margin:0;font-size:14px}.ideal b{font-weight:600}
.cmpbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cmpbar span{font-weight:600}
.cmpbar .btn{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.cmpbar .ghost{background:transparent;color:var(--bg);border-color:transparent}
.cmp{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.cmp-in{max-width:980px;margin:0 auto;display:grid;gap:14px}
.cmp-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmp-top h2{margin:0;font-size:19px;font-weight:800}
.ctab{border-collapse:separate;border-spacing:0;min-width:100%}
.ctab th[scope=row]{position:sticky;left:0;background:var(--bg);z-index:1;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;vertical-align:top;padding:10px 8px 10px 0;width:92px;min-width:92px}
.ctab td{vertical-align:top;text-align:left;padding:10px 8px;min-width:150px;max-width:260px;border-bottom:1px solid var(--line);font-size:14px}
.ctab thead td{border-bottom:2px solid var(--line)}
.ctab ul{margin:0;padding-left:16px;display:grid;gap:4px}
.ctab .big{font-size:17px}
.chead{display:flex;gap:6px;justify-content:space-between;align-items:flex-start}
.x{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;width:28px;height:28px;flex:none;cursor:pointer;font-size:16px}
.muted{color:var(--muted)}
.pickbox{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.pickbox input{width:100%;font:500 16px var(--f-display);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.pickbox input:focus{border-color:var(--accent)}
.pick{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 14px var(--f-display);padding:9px 11px;border-radius:9px;cursor:pointer}
.pick em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pick:hover{border-color:var(--accent)}
#cmppick{display:grid;gap:6px}
body.noscroll{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgb(10 14 20 / .45)}
.sheet-card{position:relative;background:var(--surface);color:var(--fg);width:100%;max-width:640px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgb(0 0 0 / .18);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
.sheet-grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.sheet-title{display:grid;gap:6px;min-width:0}
.sheet-title h2{margin:0;font-size:18px;font-weight:700;line-height:1.25;text-wrap:balance}
.sheet-acts{display:flex;gap:6px;align-items:center;flex:none}
.sheet-body{overflow-y:auto;overscroll-behavior:contain}
.sheet-body .detail{border-top:0}
.fv{gap:14px;padding-bottom:18px}
.fv .ideal{font-size:15px}
.fv ul.hl{margin:0;padding-left:20px;display:grid;gap:7px;font-size:15px;line-height:1.45}
.fv .dif{margin:0;font-size:14px;padding:10px 12px;background:var(--bg);border-radius:10px}
.tech{margin:0;display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tech>div{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.tech>div:first-child{border-top:0}
.tech dt{font-size:12.5px;color:var(--muted);font-weight:600}
.tech dd{margin:0;display:grid;gap:2px;min-width:0}
.tech dd strong{font-weight:600;font-size:14px}
.tech dd small{font-size:12.5px;color:var(--muted);line-height:1.4}
.fv .facts{padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.linkbtn{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--accent);font:600 13px var(--f-display);padding:6px 8px;border-radius:8px;cursor:pointer}
.linkbtn:hover{background:var(--accent-soft)}
.linkbtn:focus-visible,.x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:16px;max-height:85vh}.sheet-grip{display:none}}
@media (prefers-reduced-motion:reduce){.sheet-card{animation:none}}
.wrap{padding-bottom:90px}
</style>

  if(/^\$?\s*[\d.,]+$/.test(s)&&/\d/.test(s))return parseInt(s.replace(/[^\d]/g,''),10);
  return s;
}
const txt=v=>String(v??'').replace(/\s+/g,' ').trim();
const isCode=s=>/^[\d][\d-]{4,}$/.test(txt(s));
function parseSheet(name,rows){
  const h=rows.findIndex(r=>r.some(c=>norm(c)==='sku')&&r.some(c=>norm(c).startsWith('descrip')));
  if(h<0)return null;
  const H=rows[h].map(norm),find=f=>H.findIndex(f);
  const col={sku:find(c=>c==='sku'),name:find(c=>c.startsWith('descrip')),inv:find(c=>c.startsWith('invent')),
    pvp:find(c=>c.includes('pvp')),desc:find(c=>c.startsWith('descuento')),sofa:find(c=>c.startsWith('sofa')),
    obsequio:find(c=>c.startsWith('obsequio')),incentivo:find(c=>c.startsWith('incentivo')),tachado:find(c=>c.startsWith('tachado'))};
  const g=(r,k)=>col[k]>=0?r[col[k]]:'';
  const products=[],combos=[];let comboMode=false;
  for(const r of rows.slice(h+1)){
    if(!r.some(c=>txt(c)))continue;
    const first=norm(r[0]);
    if(first.startsWith('combos')){comboMode=true;continue}
    if(first==='sku')continue;
    if(comboMode||first==='combo'){
      const nm=first==='combo'?txt(g(r,'name')):txt(r[0]);if(!nm)continue;
      const alt=col.inv>=0?num(r[col.inv]):null;
      combos.push({name:nm,pvp:num(g(r,'pvp')),pvpAlt:typeof alt==='number'?alt:null,desc:num(g(r,'desc')),sofa:num(g(r,'sofa')),obsequio:txt(g(r,'obsequio'))||null,incentivo:num(g(r,'incentivo'))});
    }else{
      let sku=txt(g(r,'sku')),nm=txt(g(r,'name'));
      if(!isCode(sku)&&isCode(nm)){[sku,nm]=[nm,sku]}
      if(!nm)continue;
      products.push({sku:sku||null,name:nm,inv:col.inv>=0?num(g(r,'inv')):null,pvp:num(g(r,'pvp')),desc:num(g(r,'desc')),
        sofa:num(g(r,'sofa')),tachado:num(g(r,'tachado')),obsequio:txt(g(r,'obsequio'))||null,incentivo:num(g(r,'incentivo'))});
    }
  }
  return products.length?{label:name.trim(),rows:products,combos}:null;
}
function parseWorkbook(wb,fileName){
  const parsed=wb.SheetNames.map(n=>{
    const ws=wb.Sheets[n];
    for(const k in ws){if(k[0]!=='!'&&ws[k]&&ws[k].t==='e')ws[k]={t:'s',v:ws[k].w||'#ERROR'}}
    return parseSheet(n,XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));
  }).filter(Boolean);
  if(!parsed.length)throw new Error('No encontré ninguna hoja con las columnas SKU y DESCRIPCIÓN. Revisa que el encabezado tenga esos nombres.');
  const yr=s=>{const m=s.label.match(/(19|20)\d\d/);return m?+m[0]:null};
  if(parsed.every(yr))parsed.sort((a,b)=>yr(b)-yr(a));
  const cur=parsed[0],prev=parsed[1]||null;
  return {fileName,loadedAt:new Date().toISOString(),cur:{label:cur.label,rows:cur.rows},prev:prev?{label:prev.label,rows:prev.rows}:null,combos:cur.combos};
}

/* ---------- Estado ---------- */
let ART=null,PENDING=null,BASE=SEED,S=SEED,items=[],filter='all',open=null;
const REMOTE='precios.xlsx';
async function loadRemote(){
  if(typeof XLSX==='undefined'||location.protocol==='file:')return false;
  try{
    const r=await fetch(REMOTE+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return false;
    const ns=parseWorkbook(XLSX.read(new Uint8Array(await r.arrayBuffer()),{type:'array'}),REMOTE);
    const lm=r.headers.get('last-modified');if(lm)ns.loadedAt=new Date(lm).toISOString();
    BASE=S=ns;open=null;rebuild();render();return true;
  }catch(e){return false}
}
function rebuild(){
  const prevRows=S.prev?S.prev.rows:[];
  const bySku={},byName={};prevRows.forEach(p=>{if(p.sku)bySku[skuKey(p.sku)]=p;byName[norm(p.name)]=p});
  const curSku=new Set(S.cur.rows.map(p=>skuKey(p.sku||''))),curName=new Set(S.cur.rows.map(p=>norm(p.name)));
  items=[];
  S.cur.rows.forEach((p,i)=>items.push({id:'a'+i,type:'cur',...p,old:(p.sku&&bySku[skuKey(p.sku)])||byName[norm(p.name)]||null}));
  (S.combos||[]).forEach((c,i)=>items.push({id:'c'+i,type:'combo',sku:null,...c}));
  prevRows.forEach((p,i)=>{if(!(p.sku&&curSku.has(skuKey(p.sku)))&&!curName.has(norm(p.name)))items.push({id:'o'+i,type:'old',...p,inv:null,desc:null,obsequio:null,incentivo:null})});
  if(typeof CMP!=='undefined'){CMP=[]}
  if(document.getElementById('sheet'))document.getElementById('sheet').hidden=true;
  items.forEach(it=>{it._n=norm(it.name);it._nc=it._n.replace(/ /g,'');it._s=skuKey(it.sku||'');it._m=models(it.name)});
  const cl=S.cur.label,pl=S.prev&&S.prev.label;
  $('#sub').textContent=`Lista ${cl}${pl?' · comparativo '+pl:''}`;
  const dt=S.loadedAt?new Date(S.loadedAt):null;
  $('#upd').hidden=!dt;
  if(dt)$('#upd').innerHTML='Precios actualizados: <strong>'+dt.toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric',timeZone:'America/Bogota'})+'</strong> a las <strong>'+dt.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/Bogota'})+'</strong>';
  $('#chipCur').textContent='Productos '+cl;
  $('#chipOld').hidden=!items.some(i=>i.type==='old');$('#chipOld').textContent='Solo en lista '+(pl||'anterior');
  showStatus();
}
function showStatus(extra){
  const n=S.cur.rows.length,c=(S.combos||[]).length,inc=items.filter(i=>hasInc(i)).length;
  const when=S.loadedAt?'actualizada '+new Date(S.loadedAt).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'lista incluida en la página';
  $('#status').innerHTML=(extra||'')+`<div>Lista en uso: <strong>${esc(S.fileName||'—')}</strong> (${when}) · ${n} productos, ${c} combos, ${inc} con incentivo.</div>`;
  $('#reset').hidden=S===BASE;$('#pub').hidden=!(ART&&PENDING&&S===PENDING);
}
const hasInc=it=>typeof it.incentivo==='number'&&it.incentivo>0;

/* ---------- Búsqueda ---------- */
function score(it,q){
  if(!q)return 1;
  const qs=skuKey(q);
  if(qs&&it._s&&it._s===qs)return 100;
  if(qs.length>=3&&it._s&&it._s.includes(qs)&&/\d/.test(q))return 50;
  const toks=norm(q).split(' ');
  if(toks.every(t=>it._n.includes(t)||it._nc.includes(t)||(it._s&&it._s.includes(t.replace(/[^a-z0-9]/g,'')))))
    return 10+(it._n.startsWith(toks[0])?2:0)+(toks.some(t=>it._m.map(m=>m.toLowerCase()).includes(t))?5:0)+toks.filter(t=>it._n.split(/[^a-z0-9]+/).includes(t)).length*3+(it.type==='cur'?3:0);
  return 0;
}
function hl(text,q){
  if(!q)return esc(text);
  const chars=[...String(text)],n=chars.map(ch=>ch.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().charAt(0)||ch).join('');
  const marks=new Array(chars.length).fill(false);
  norm(q).split(' ').filter(t=>t.length>1).forEach(t=>{let i=n.indexOf(t);while(i>=0){for(let k=i;k<i+t.length;k++)marks[k]=true;i=n.indexOf(t,i+1)}});
  let out='',on=false;chars.forEach((ch,k)=>{if(marks[k]&&!on){out+='<mark>';on=true}if(!marks[k]&&on){out+='</mark>';on=false}out+=esc(ch)});
  return on?out+'</mark>':out;
}
function stockPill(it){
  if(it.type==='combo')return '<span class="pill p-acc">Combo</span>';
  if(it.type==='old')return `<span class="pill p-bad">No está en lista ${esc(S.cur.label)}</span>`;
  const n=it.inv;if(typeof n!=='number')return '';
  const cls=n===0?'p-bad':n<=5?'p-warn':'p-ok';return `<span class="pill ${cls}">${n} und</span>`;
}
const incPill=it=>hasInc(it)?`<span class="pill p-inc">Incentivo ${money(it.incentivo)}</span>`:'';
const mainPrice=it=>it.sofa!=null&&it.sofa!==''?it.sofa:it.pvp;
function render(){
  const q=$('#q').value.trim();$('#clr').hidden=!q;
  let res=items.filter(it=>filter==='all'||(filter==='inc'?hasInc(it):it.type===filter)).map(it=>[it,score(it,q)]).filter(x=>x[1]>0);
  const tp={cur:2,combo:1,old:0};
  if(q)res.sort((a,b)=>b[1]-a[1]||tp[b[0].type]-tp[a[0].type]);
  else if(filter==='inc')res.sort((a,b)=>b[0].incentivo-a[0].incentivo);
  const extra=filter==='inc'?' con incentivo':'';
  $('#count').textContent=res.length?`${res.length} resultado${res.length>1?'s':''}${extra}${q?` para “${q}”`:''}`:'';
  $('#list').innerHTML=res.length?res.map(([it])=>card(it,q)).join(''):
    `<div class="empty">No hay nada${extra} con “${esc(q)}”.<br>Prueba solo el modelo (ej. <b>G305</b>) o los últimos dígitos del SKU.</div>`;
}
function card(it,q){
  const mp=mainPrice(it);
  const strike=typeof it.pvp==='number'&&typeof mp==='number'&&it.pvp!==mp?`<s>PVP ${money(it.pvp)}</s>`:'';
  return `<div class="item"><button class="row" data-id="${it.id}" aria-haspopup="dialog">
    <div class="name">${hl(it.name,q)}</div>
    <div class="price"><b>${money(mp)}</b>${strike}</div>
    <div class="meta">${it.sku?`<span class="sku">${hl(it.sku,q)}</span>`:''}${stockPill(it)}${incPill(it)}${it.obsequio?`<span>Obsequio: ${esc(it.obsequio)}</span>`:''}</div>
  </button></div>`;
}
const kv=(l,v,c)=>`<div class="kv${c?' '+c:''}"><span>${l}</span><strong>${v}</strong></div>`;
function pct(a,b){if(typeof a!=='number'||typeof b!=='number'||!b)return '';const d=(a-b)/b*100;if(Math.abs(d)<.05)return '<span>=</span>';return `<span class="${d>0?'up':'down'}">${d>0?'+':''}${d.toFixed(1)}%</span>`}
function detail(it){
  const cl=esc(S.cur.label),pl=S.prev?esc(S.prev.label):'';
  let h='<div class="detail">';
  if(it.type==='old'){
    h+=`<div class="grid">${kv('SOFA '+pl,money(it.sofa),'hl')}${kv('PVP Logi Store '+pl,money(it.pvp))}${kv('Tachado '+pl,money(it.tachado))}</div>

  }else{
    const pvpAlt=it.type==='combo'&&typeof it.pvpAlt==='number'?kv('PVP alterno',money(it.pvpAlt)):'';

    h+=`<div class="grid">${kv('SOFA',money(it.sofa),'hl')}${kv('PVP Logi Store',money(it.pvp))}${pvpAlt}${kv('Descuento',money(it.desc))}${neto}
      ${it.type==='cur'?kv('Inventario',typeof it.inv==='number'?it.inv+' und':'—'):''}${kv('Obsequio',esc(it.obsequio||'—'))}${kv('Incentivo',hasInc(it)?money(it.incentivo):'Sin incentivo',hasInc(it)?'inc':'')}</div>`;
    if(it.sku)h+=`<p class="note">SKU <span class="sku">${esc(it.sku)}</span> · <button class="copy" data-copy="${esc(it.sku)}">Copiar SKU</button></p>`;
    if(it.type==='cur'&&S.prev){
      if(it.old){
        const o=it.old;
        h+=`<div><h3>Comparativo con lista ${pl}</h3><div class="tw"><table><tr><th>Precio</th><th>${pl}</th><th>${cl}</th><th>Cambio</th></tr>
        <tr><td>SOFA</td><td>${money(o.sofa)}</td><td>${money(it.sofa)}</td><td>${pct(it.sofa,o.sofa)}</td></tr>

    }
  }

  const ms=it._m;

    if(cmb.length)h+=`<div><h3>Combos que lo incluyen</h3>${cmb.map(c=>`<div class="combo"><div class="n">${esc(c.name)}</div><div class="v">${money(c.sofa)}</div><div class="s">PVP ${money(c.pvp)}${c.obsequio?' · Obsequio '+esc(c.obsequio):''}${hasInc(c)?' · Incentivo '+money(c.incentivo):''}</div></div>`).join('')}</div>`;
    const rel=items.filter(x=>x.id!==it.id&&x.type!=='combo'&&x._m.some(m=>ms.includes(m)));
    if(rel.length)h+=`<div><h3>${it.type==='combo'?'Productos del combo':'Otras versiones y colores'}</h3><div class="rel">${rel.map(r=>`<button data-go="${r.id}">${esc(r.name)}<em>${money(mainPrice(r))}${typeof r.inv==='number'?' · '+r.inv+' und':''}${hasInc(r)?' · Inc. '+money(r.incentivo):''}${r.type==='old'?' · '+pl:''}</em></button>`).join('')}</div></div>`;
  }
  return h+'</div>';
}

/* ---------- Carga de archivo ---------- */
function loadFile(f){
  if(!f)return;
  if(typeof XLSX==='undefined'){showStatus('<div class="msg err">No se pudo cargar el lector de Excel. Revisa la conexión y recarga la página.</div>');return}
  showStatus(`<div class="msg">Leyendo ${esc(f.name)}…</div>`);
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ns=parseWorkbook(wb,f.name);
      S=ns;PENDING=ns;open=null;rebuild();render();
      const tail=ART?' Revisa algunos productos y toca <strong>Publicar para todos</strong>.':' Esta es solo una vista previa en este dispositivo: para publicarla abre la página con tu cuenta de Claude.';
      showStatus(`<div class="msg ok">Se cargó la hoja “${esc(ns.cur.label)}”${ns.prev?` y se compara con “${esc(ns.prev.label)}”`:''}.${tail}</div>`);
    }catch(err){showStatus(`<div class="msg err">${esc(err.message||'No se pudo leer el archivo.')}</div>`)}
    $('#file').value='';
  };
  r.onerror=()=>showStatus('<div class="msg err">No se pudo abrir el archivo. Intenta de nuevo.</div>');
  r.readAsArrayBuffer(f);
}

/* ---------- Comparador ---------- */
let CMP=[];

function toggleCmp(id){
  if(CMP.includes(id))CMP=CMP.filter(x=>x!==id);
  else{if(CMP.length>=3){CMP.shift()}CMP.push(id)}
  renderCmp();render();
  if(CMP.includes(id))openCmp(CMP.length<2);
}
function openCmp(focusPick){$('#cmp').hidden=false;document.body.classList.add('noscroll');renderCmp();if(focusPick)setTimeout(()=>$('#cmpq').focus(),50)}
function closeCmp(){$('#cmp').hidden=true;document.body.classList.remove('noscroll')}
function renderCmp(){
  CMP=CMP.filter(id=>byId(id));

  $('#cmpcount').textContent=`Comparando ${CMP.length} producto${CMP.length>1?'s':''}`;

  const its=CMP.map(byId),fx=its.map(featFor);
  const sofas=its.map(i=>typeof i.sofa==='number'?i.sofa:null).filter(v=>v!=null);
  const minS=sofas.length>1?Math.min(...sofas):null;
  const cell=(i,html)=>`<td>${html}</td>`;
  const row=(label,fn)=>`<tr><th scope="row">${label}</th>${its.map((it,k)=>cell(k,fn(it,fx[k]))).join('')}</tr>`;
  const fact=v=>v&&v!=='—'?esc(v):'<span class="muted">—</span>';
  let h='';
  if(its.length){
    h+=`<div class="tw"><table class="ctab"><thead><tr><th></th>${its.map(it=>`<td><div class="chead"><strong>${esc(it.name)}</strong><button class="x" data-rm="${it.id}" aria-label="Quitar">×</button></div>${it.sku?`<span class="sku">${esc(it.sku)}</span>`:''}</td>`).join('')}</tr></thead><tbody>`;
    h+=row('Precio SOFA',it=>`<b class="big">${money(it.sofa)}</b>${minS!=null&&it.sofa===minS?' <span class="pill p-ok">Más económico</span>':''}`);
    h+=row('PVP Logi Store',it=>money(it.pvp));
    h+=row('Inventario',it=>typeof it.inv==='number'?it.inv+' und':'—');
    h+=row('Incentivo',it=>hasInc(it)?`<span class="pill p-inc">${money(it.incentivo)}</span>`:'Sin incentivo');
    h+=row('Obsequio',it=>esc(it.obsequio||'—'));
    h+=row('Tipo',(it,f)=>f?esc(f.cat):'—');
    h+=row('Ideal para',(it,f)=>f?esc(f.ideal):'—');
    h+=row('Conexión',(it,f)=>f?fact(f.c):'—');
    h+=row('Batería',(it,f)=>f?fact(f.b):'—');
    h+=row('Peso / tamaño',(it,f)=>f?fact(f.w):'—');
    if(fx.some(f=>f&&f.dmax)){h+=row('DPI mínimo',(it,f)=>f&&f.dmin?fact(f.dmin):'—');h+=row('DPI máximo',(it,f)=>f&&f.dmax?fact(f.dmax):'—');h+=row('Software',(it,f)=>f&&f.sw?'Opcional: Logitech G HUB':'—')}
    h+=row('Lo que destaca',(it,f)=>f?`<ul>${f.h.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'—');
    h+=row('En qué se diferencia',(it,f)=>f?esc(f.d):'—');
    h+='</tbody></table></div>';
  }
  if(its.length<3)h+=`<p class="note">${its.length<2?'Busca abajo el producto con el que lo quieres comparar.':'Puedes agregar un producto más (máximo 3).'}</p>`;
  $('#cmpbody').innerHTML=h;
  pickRender();
}
function pickRender(){
  const q=$('#cmpq').value.trim();
  const res=q?items.filter(it=>it.type!=='combo'&&!CMP.includes(it.id)).map(it=>[it,score(it,q)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8):[];
  $('#cmppick').innerHTML=q&&!res.length?'<p class="note">No hay resultados.</p>':res.map(([it])=>`<button class="pick" data-add="${it.id}"><span>${hl(it.name,q)}</span><em>${money(mainPrice(it))}</em></button>`).join('');
}
$('#cmpq').addEventListener('input',pickRender);
$('#cmp').addEventListener('click',e=>{
  const a=e.target.closest('[data-add]');if(a){if(CMP.length>=3)CMP.shift();CMP.push(a.dataset.add);$('#cmpq').value='';renderCmp();render();return}
  const r=e.target.closest('[data-rm]');if(r){CMP=CMP.filter(x=>x!==r.dataset.rm);renderCmp();render();return}
});
$('#cmpclose').addEventListener('click',()=>{closeCmp();renderCmp()});
$('#cmpclear').addEventListener('click',()=>{CMP=[];closeCmp();renderCmp();render()});
$('#cmpopen').addEventListener('click',()=>openCmp(CMP.length<2));
$('#cmpreset').addEventListener('click',()=>{CMP=[];closeCmp();renderCmp();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#cmp').hidden){closeCmp();renderCmp()}});

rebuild();render();
(async()=>{try{ART=window.claude&&await window.claude.use('artifact')}catch(e){ART=null}
  if(!ART)$('#howto').innerHTML='Elige el Excel para revisarlo en este dispositivo. Para que todos vean la lista nueva, publícala desde la página en Claude.';
  showStatus()})();
const RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(st){
  const SC='script';
  const json=JSON.stringify(st).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
    +HEAD_HTML+'\n<style id="app-css">'+document.getElementById('app-css').textContent+'</style>\n'
    +'<template id="app-markup">'+document.getElementById('app-markup').innerHTML+'</template>\n<div id="root"></div>\n'
    +'<'+SC+' type="application/json" id="seed">'+json+'</'+SC+'>\n'
    +'<'+SC+' type="application/json" id="feat">'+document.getElementById('feat').textContent.replace(/</g,'\\u003c')+'</'+SC+'>\n'
    +'<'+SC+' src="'+XLSX_SRC+'"></'+SC+'>\n'
    +'<'+SC+' id="app-js">'+document.getElementById('app-js').textContent+'</'+SC+'>\n</body></html>';
}
$('#pub').addEventListener('click',async()=>{
  if(!ART||!PENDING)return;
  const b=$('#pub');b.disabled=true;b.textContent='Publicando…';
  try{
    const st={...PENDING,loadedAt:new Date().toISOString()};
    await ART.publish(buildDoc(st));
    showStatus('<div class="msg ok">Publicado. La página se recarga con la lista nueva.</div>');
  }catch(e){
    const c=e&&e.code;
    const m=c==='conflict'?'Alguien publicó otra versión al mismo tiempo. La página se recarga; vuelve a cargar el Excel si hace falta.'
      :(c==='not_granted'||c==='not_writer')?'Tu cuenta no tiene permiso para publicar esta página. Pide al dueño que te dé acceso de edición.'
      :'No se pudo publicar ('+(e&&e.message||'error')+'). Intenta de nuevo.';
    showStatus('<div class="msg err">'+esc(m)+'</div>');b.disabled=false;b.textContent='Publicar para todos';
  }
});
</script>

</body>
